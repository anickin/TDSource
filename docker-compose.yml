services:
  tdsource:
    image: tdsource:portfolio
    build:
      context: .
      dockerfile: Dockerfile
    # Preserve the name already used by the server's Nginx upstream.
    container_name: webapp-prod
    restart: unless-stopped
    env_file:
      - ${TDS_ENV_FILE:-docker.env}
    environment:
      NODE_ENV: production
      PORT: "8787"
      TDS_DEPLOYMENT_MODE: portfolio
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - public-web

networks:
  public-web:
    external: true
